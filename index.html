      height: 1.2rem;
      accent-color: #1e3a6b;
      cursor: pointer;

      // ========== RENDER KUIS ==========
      const quizContainer = document.getElementById('quizContainer');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const progressDisplay = document.getElementById('progressDisplay');
      const resetAllBtn = document.getElementById('resetAllBtn');

      // State: menyimpan jawaban & status penilaian per soal
      const userAnswers = new Array(questions.length).fill(null).map(() => ({
        selected: [],
        checked: false,
        isCorrect: false
      }));

      // Helper: format label opsi (A, B, C, ...)
      const letterLabel = (idx) => String.fromCharCode(65 + idx);

      // Render semua soal
      function renderQuiz() {
        let html = '';
        questions.forEach((q, qIndex) => {
          const ans = userAnswers[qIndex];
          const isChecked = ans.checked;
          const selected = ans.selected;

          // Tipe soal label
          let typeLabel = '';
          if (q.type === 'multiple') typeLabel = 'Pilih lebih dari satu';
          else if (q.type === 'combination') typeLabel = 'Pilih kombinasi';
          else if (q.type === 'cause') typeLabel = 'Sebab-Akibat';

          html += `<div class="card" id="card-${qIndex}" data-qindex="${qIndex}">`;
          html += `<div class="question-header">
            <span class="question-number">Soal ${qIndex + 1}</span>
            <span class="question-type">${typeLabel}</span>
          </div>`;
          html += `<div class="question-text">${q.question}</div>`;
          html += `<div class="options">`;

          q.options.forEach((opt, optIndex) => {
            const isSelected = selected.includes(optIndex);
            const showCorrect = isChecked && q.correct.includes(optIndex);
            const showWrong = isChecked && isSelected && !q.correct.includes(optIndex);
            let optClass = 'option';
            if (showCorrect) optClass += ' correct-highlight';
            else if (showWrong) optClass += ' wrong-highlight';

            html += `<div class="${optClass}" data-optindex="${optIndex}">
              <input type="checkbox" id="q${qIndex}opt${optIndex}" value="${optIndex}" ${isSelected ? 'checked' : ''} ${isChecked ? 'disabled' : ''}>
              <label for="q${qIndex}opt${optIndex}">${letterLabel(optIndex)}. ${opt}</label>
            </div>`;
          });

          html += `</div>`;

          // Tombol periksa (jika belum dinilai)
          if (!isChecked) {
            html += `<button class="btn-check check-btn" data-qindex="${qIndex}">Periksa Jawaban</button>`;
            html += `<div class="empty-msg" id="empty-${qIndex}" style="display:none;">Pilih setidaknya satu jawaban!</div>`;
          } else {
            // Tampilkan feedback
            const correctLetters = q.correct.map(i => letterLabel(i)).join(', ');
            const statusText = ans.isCorrect ? '✅ Jawaban Benar!' : '❌ Jawaban Kurang Tepat';
            html += `<div class="feedback">
              <strong>${statusText}</strong><br>
              <span>Kunci: ${correctLetters}</span><br>
              <span>${q.explanation}</span>
            </div>`;
          }

          html += `</div>`;
        });

        quizContainer.innerHTML = html;
        updateStats();

        // Pasang event listener untuk checkbox
        document.querySelectorAll('.option input[type="checkbox"]').forEach(cb => {
          cb.addEventListener('change', function(e) {
            const card = this.closest('.card');
            const qIndex = parseInt(card.dataset.qindex);
            const optIndex = parseInt(this.value);
            const ans = userAnswers[qIndex];
            if (ans.checked) return; // sudah dinilai, tidak bisa diubah

            if (this.checked) {
              if (!ans.selected.includes(optIndex)) ans.selected.push(optIndex);
            } else {
              ans.selected = ans.selected.filter(i => i !== optIndex);
            }
            // Sembunyikan pesan empty
            const emptyMsg = document.getElementById(`empty-${qIndex}`);
            if (emptyMsg) emptyMsg.style.display = 'none';
          });
        });

        // Pasang event listener tombol periksa
        document.querySelectorAll('.check-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const qIndex = parseInt(this.dataset.qindex);
            checkAnswer(qIndex);
          });
        });
      }

      // Periksa jawaban satu soal
      function checkAnswer(qIndex) {
        const q = questions[qIndex];
        const ans = userAnswers[qIndex];
        if (ans.checked) return;

        if (ans.selected.length === 0) {
          const emptyMsg = document.getElementById(`empty-${qIndex}`);
          if (emptyMsg) emptyMsg.style.display = 'block';
          return;
        }

        // Tentukan benar jika himpunan selected sama dengan correct
        const correctSet = new Set(q.correct);
        const selectedSet = new Set(ans.selected);
        const isCorrect = correctSet.size === selectedSet.size && [...correctSet].every(v => selectedSet.has(v));

        ans.checked = true;
        ans.isCorrect = isCorrect;

        // Render ulang kartu ini saja? Lebih mudah render ulang seluruh kuis untuk konsistensi
        renderQuiz();
      }

      // Update skor & progress
      function updateStats() {
        const checkedCount = userAnswers.filter(a => a.checked).length;
        const correctCount = userAnswers.filter(a => a.checked && a.isCorrect).length;
        scoreDisplay.textContent = `Skor: ${correctCount} / 30`;
        progressDisplay.textContent = `${checkedCount} soal dinilai`;
      }

      // Reset semua jawaban
      function resetAll() {
        for (let i = 0; i < userAnswers.length; i++) {
          userAnswers[i] = { selected: [], checked: false, isCorrect: false };
        }
        renderQuiz();
      }

      // Inisialisasi
      renderQuiz();

      // Event reset all
      resetAllBtn.addEventListener('click', resetAll);
    })();
  </script>
